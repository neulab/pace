[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["proxy_bench"]

[tool.hatch.metadata]
allow-direct-references = true

[project]
name = "proxy_bench"
version = "0.0.1"
readme = "README.md"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
requires-python = ">=3.12"
license = { "text" = "MIT" }
dependencies = [
    "absl-py>=2.3.1",
    "immutabledict>=4.2.2",
    "langdetect>=1.0.9",
    "nltk>=3.9.2",
    "openai>=2.8.1",
    "yeval @ git+https://github.com/lintangsutawika/yaeval-harness.git#main",
    "evalplus",
]

[tool.setuptools.packages.find]
include = ["proxy_bench/*"]

[tool.uv.sources]
evalplus = { path = "vendor/evalplus" }